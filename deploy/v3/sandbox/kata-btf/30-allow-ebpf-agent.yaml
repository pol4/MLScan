# B1: разрешение контейнера-агента in-guest eBPF в mlscan-sandbox.
#
# ВНИМАНИЕ: это ослабление политики безопасности namespace (требует согласования!).
# Причина: eBPF-агенту нужны capabilities BPF/PERFMON, которые PodSecurity-профиль
# "restricted" запрещает добавлять. Переводим namespace в профиль "baseline" —
# он допускает добавление capabilities, сохраняя требования non-root/RO-FS/seccomp
# (их отдельно требует наша Kyverno-политика mlscan-sandbox-jobs).
#
# Применять ТОЛЬКО после явного согласования:
#   kubectl apply -f deploy/v3/sandbox/kata-btf/30-allow-ebpf-agent.yaml
#
# Проверка: kubectl -n mlscan-sandbox get pod -l app=mlscan-scan -o jsonpath='{.items[0].spec.containers[*].name}'
apiVersion: v1
kind: Namespace
metadata:
  name: mlscan-sandbox
  labels:
    # было: restricted (не допускает add capabilities) -> baseline (допускает BPF/PERFMON у агента)
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    app.kubernetes.io/part-of: mlscan
---
# Явное правило Kyverno: агент — только с digest-образом, без привилегий, минимальные caps.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: mlscan-ebpf-agent-guard
spec:
  validationFailureAction: Enforce
  background: false
  rules:
  - name: agent-caps-limited
    match:
      any:
      - resources: {kinds: [Job], namespaces: [mlscan-sandbox]}
    validate:
      message: >-
        контейнер ebpf-agent может добавлять только BPF и PERFMON (drop=ALL, non-root, RO-FS, seccomp)
      pattern:
        spec:
          template:
            spec:
              containers:
              - (name): ebpf-agent
                image: "*@sha256:*"
                securityContext:
                  runAsNonRoot: true
                  readOnlyRootFilesystem: true
                  allowPrivilegeEscalation: false
                  seccompProfile: {type: RuntimeDefault}
                  capabilities:
                    drop: ["ALL"]
                    add: ["BPF", "PERFMON"]
