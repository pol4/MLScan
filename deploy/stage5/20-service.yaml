# Ops/Observability (Компонента 5): метрики, здоровье стека, качество, retest.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlscan-ops
  namespace: mlscan-ops
  labels: {app: mlscan-ops, app.kubernetes.io/part-of: mlscan, mlscan.io/stage: "5"}
spec:
  replicas: 1
  selector:
    matchLabels: {app: mlscan-ops}
  template:
    metadata:
      labels: {app: mlscan-ops}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: ops
        image: python:3.12-slim
        imagePullPolicy: IfNotPresent
        command: ["python", "/opt/svc/mlscan_ops.py"]
        env:
        - {name: ANALYTICS_URL, value: "http://mlscan-analytics.mlscan-analytics.svc.cluster.local:8080"}
        - {name: TESTING_URL, value: "http://mlscan-testing.mlscan-testing.svc.cluster.local:8080"}
        - {name: INTEGRATIONS_URL, value: "http://mlscan-integrations.mlscan-integrations.svc.cluster.local:8080"}
        - {name: GOLDEN_PATH, value: /etc/mlscan/golden.json}
        - {name: SAMPLES_DIR, value: /samples}
        - {name: PORT, value: "8080"}
        - {name: RETEST_INTERVAL, value: "0"}
        - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
        - {name: PYTHONUTF8, value: "1"}
        - {name: TMPDIR, value: /tmp}
        ports:
        - {name: http, containerPort: 8080}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: ["ALL"]}
        readinessProbe:
          httpGet: {path: /healthz, port: 8080}
          initialDelaySeconds: 3
        resources:
          requests: {cpu: "50m", memory: "96Mi"}
          limits: {cpu: "300m", memory: "256Mi"}
        volumeMounts:
        - {name: svc-code, mountPath: /opt/svc, readOnly: true}
        - {name: golden, mountPath: /etc/mlscan, readOnly: true}
        - {name: samples, mountPath: /samples, readOnly: true}
        - {name: tmp, mountPath: /tmp}
      volumes:
      - {name: svc-code, configMap: {name: mlscan-ops-code}}
      - {name: golden, configMap: {name: mlscan-golden}}
      - {name: samples, configMap: {name: mlscan-golden-samples}}
      - {name: tmp, emptyDir: {sizeLimit: 64Mi, medium: Memory}}
---
apiVersion: v1
kind: Service
metadata:
  name: mlscan-ops
  namespace: mlscan-ops
  labels: {app: mlscan-ops}
spec:
  type: NodePort
  selector: {app: mlscan-ops}
  ports:
  - {name: http, port: 8080, targetPort: 8080, nodePort: 30810}
