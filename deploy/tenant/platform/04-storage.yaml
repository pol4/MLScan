apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlscan-testing-data
  namespace: t-mlscan-app
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: ceph-rwo
  resources:
    requests:
      storage: 5Gi
