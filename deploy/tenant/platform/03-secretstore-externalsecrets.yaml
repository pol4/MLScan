apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-vault
  namespace: t-mlscan-app
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
  namespace: t-mlscan-app
spec:
  provider:
    vault:
      server: http://platform-vault.pf-secrets.svc.cluster.local:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: tenant-mlscan
          serviceAccountRef:
            name: eso-vault
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mlscan-pg
  namespace: t-mlscan-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: mlscan-pg
  data:
    - {secretKey: PGUSER, remoteRef: {key: tenants/mlscan/db, property: username}}
    - {secretKey: PGPASSWORD, remoteRef: {key: tenants/mlscan/db, property: password}}
    - {secretKey: POSTGRES_PASSWORD, remoteRef: {key: tenants/mlscan/db, property: password}}
    - {secretKey: PGHOST, remoteRef: {key: tenants/mlscan/db, property: host}}
    - {secretKey: PGPORT, remoteRef: {key: tenants/mlscan/db, property: port}}
    - {secretKey: PGDATABASE, remoteRef: {key: tenants/mlscan/db, property: dbname}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-pull
  namespace: t-mlscan-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: harbor-pull
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"{{ .registry }}":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}'
  data:
    - {secretKey: registry, remoteRef: {key: tenants/mlscan/harbor, property: registry}}
    - {secretKey: username, remoteRef: {key: tenants/mlscan/harbor, property: username}}
    - {secretKey: password, remoteRef: {key: tenants/mlscan/harbor, property: password}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mlscan-git
  namespace: t-mlscan-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: mlscan-git
  data:
    - {secretKey: url, remoteRef: {key: tenants/mlscan/git, property: url}}
    - {secretKey: token, remoteRef: {key: tenants/mlscan/git, property: token}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mlscan-app
  namespace: t-mlscan-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: mlscan-keys
  data:
    - {secretKey: MLSCAN_EVIDENCE_KEY, remoteRef: {key: tenants/mlscan/app, property: evidence_key}}
    - {secretKey: MLSCAN_KEYS, remoteRef: {key: tenants/mlscan/app, property: api_keys}}
    - {secretKey: INTERNAL_KEY, remoteRef: {key: tenants/mlscan/app, property: internal_key}}
    - {secretKey: SESSION_SECRET, remoteRef: {key: tenants/mlscan/app, property: session_secret}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mlscan-s3
  namespace: t-mlscan-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: mlscan-s3
  data:
    - {secretKey: ENDPOINT, remoteRef: {key: tenants/mlscan/s3, property: endpoint}}
    - {secretKey: REGION, remoteRef: {key: tenants/mlscan/s3, property: region}}
    - {secretKey: BUCKET, remoteRef: {key: tenants/mlscan/s3, property: bucket}}
    - {secretKey: ACCESS_KEY, remoteRef: {key: tenants/mlscan/s3, property: access_key}}
    - {secretKey: SECRET_KEY, remoteRef: {key: tenants/mlscan/s3, property: secret_key}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mlscan-oidc
  namespace: t-mlscan-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: mlscan-oidc
  data:
    - {secretKey: OIDC_CLIENT_ID, remoteRef: {key: tenants/mlscan/oidc, property: client_id}}
    - {secretKey: OIDC_CLIENT_SECRET, remoteRef: {key: tenants/mlscan/oidc, property: client_secret}}
