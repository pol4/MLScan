apiVersion: batch/v1
kind: Job
metadata:
  name: mlscan-db-migrate
  namespace: t-mlscan-app
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: mlscan-db-migrate
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: harbor-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: harbor.platform.rtx.local/proxy-dockerhub/library/postgres@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "applying v2+v3 schema (single transaction)"
              psql -v ON_ERROR_STOP=1 --single-transaction \
                -f /schema/v2/01-schema.sql -f /schema/v3/schema-v3.sql
              echo "schema applied"
          env:
            - name: PGHOST
              valueFrom: {secretKeyRef: {name: mlscan-pg, key: PGHOST}}
            - name: PGPORT
              valueFrom: {secretKeyRef: {name: mlscan-pg, key: PGPORT}}
            - name: PGUSER
              valueFrom: {secretKeyRef: {name: mlscan-pg, key: PGUSER}}
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: mlscan-pg, key: PGPASSWORD}}
            - name: PGDATABASE
              valueFrom: {secretKeyRef: {name: mlscan-pg, key: PGDATABASE}}
            - {name: HOME, value: /tmp}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
            limits: {cpu: "500m", memory: "512Mi"}
          volumeMounts:
            - {name: schema-v2, mountPath: /schema/v2, readOnly: true}
            - {name: schema-v3, mountPath: /schema/v3, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: schema-v2
          configMap:
            name: mlscan-pg-init
        - name: schema-v3
          configMap:
            name: mlscan-pg-schema-v3
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
