apiVersion: v1
kind: ConfigMap
metadata:
  name: mlscan-artifacts-proxy
  namespace: t-mlscan-sandbox
data:
  nginx.conf: |
    worker_processes 1;
    error_log /dev/stderr warn;
    pid /tmp/nginx.pid;
    events { worker_connections 1024; }
    http {
      access_log /dev/stdout;
      client_body_temp_path /tmp/client_body;
      proxy_temp_path /tmp/proxy;
      fastcgi_temp_path /tmp/fastcgi;
      uwsgi_temp_path /tmp/uwsgi;
      scgi_temp_path /tmp/scgi;
      resolver 10.96.0.10 valid=10s ipv6=off;
      server {
        listen 8090;
        location / {
          set $upstream http://mlscan-testing.t-mlscan-app.svc.cluster.local:8090;
          proxy_pass $upstream;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_buffering off;
          proxy_request_buffering off;
          client_max_body_size 0;
          proxy_read_timeout 3600s;
          proxy_send_timeout 3600s;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlscan-artifacts-proxy
  namespace: t-mlscan-sandbox
  labels: {app: mlscan-artifacts-proxy, app.kubernetes.io/part-of: mlscan}
spec:
  replicas: 1
  selector:
    matchLabels: {app: mlscan-artifacts-proxy}
  template:
    metadata:
      labels: {app: mlscan-artifacts-proxy}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: harbor-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: nginx
          image: harbor.platform.rtx.local/proxy-dockerhub/library/nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8090}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          readinessProbe:
            tcpSocket: {port: 8090}
            initialDelaySeconds: 3
          livenessProbe:
            tcpSocket: {port: 8090}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: {cpu: "50m", memory: "64Mi"}
            limits: {cpu: "500m", memory: "256Mi"}
          volumeMounts:
            - {name: config, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: config, configMap: {name: mlscan-artifacts-proxy}}
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: mlscan-artifacts
  namespace: t-mlscan-sandbox
  labels: {app: mlscan-artifacts-proxy}
spec:
  clusterIP: None
  selector: {app: mlscan-artifacts-proxy}
  ports:
    - {name: http, port: 8090, targetPort: 8090}
