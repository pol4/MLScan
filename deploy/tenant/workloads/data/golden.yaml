apiVersion: v1
kind: ConfigMap
metadata:
  name: mlscan-redteam
  namespace: t-mlscan-sandbox
  labels:
    app.kubernetes.io/part-of: mlscan
    mlscan.io/stage: '5'
data:
  redteam.py: "#!/usr/bin/env python3\n# -*- coding: utf-8 -*-\n\"\"\"Red-team / escape-\u0442\
    \u0435\u0441\u0442 (\u042D\u0442\u0430\u043F 5).\n\n\u0417\u0430\u043F\u0443\u0441\
    \u043A\u0430\u0435\u0442\u0441\u044F \u0432 \u043F\u0435\u0441\u043E\u0447\u043D\
    \u0438\u0446\u0435 \u042D\u0442\u0430\u043F\u0430 1 (Kata, restricted, default-deny\
    \ egress) \u0438 \u043F\u0440\u043E\u0432\u0435\u0440\u044F\u0435\u0442,\n\u0447\
    \u0442\u043E \u043E\u0436\u0438\u0434\u0430\u0435\u043C\u044B\u0435 \u043E\u0433\
    \u0440\u0430\u043D\u0438\u0447\u0435\u043D\u0438\u044F \u0434\u0435\u0439\u0441\
    \u0442\u0432\u0438\u0442\u0435\u043B\u044C\u043D\u043E \u0441\u043E\u0431\u043B\
    \u044E\u0434\u0430\u044E\u0442\u0441\u044F. \u0412\u043E\u0437\u0432\u0440\u0430\
    \u0449\u0430\u0435\u0442 JSON \u0438 exit code\n0, \u0435\u0441\u043B\u0438 \u0412\
    \u0421\u0415 \u043E\u0436\u0438\u0434\u0430\u043D\u0438\u044F \u0432\u044B\u043F\
    \u043E\u043B\u043D\u0435\u043D\u044B (\u0438\u0437\u043E\u043B\u044F\u0446\u0438\
    \u044F \u0440\u0430\u0431\u043E\u0442\u0430\u0435\u0442), \u0438\u043D\u0430\u0447\
    \u0435 1.\n\"\"\"\nimport json\nimport os\nimport socket\nimport sys\n\n\ndef\
    \ try_external():\n    s = socket.socket()\n    s.settimeout(3)\n    try:\n  \
    \      s.connect((\"1.1.1.1\", 443))\n        return \"connect_ok\"\n    except\
    \ Exception as e:  # noqa: BLE001\n        return f\"blocked:{type(e).__name__}\"\
    \n    finally:\n        s.close()\n\n\ndef try_sinkhole():\n    s = socket.socket()\n\
    \    s.settimeout(3)\n    try:\n        s.connect((\"sinkhole\", 8080))\n    \
    \    return \"connect_ok\"\n    except Exception as e:  # noqa: BLE001\n     \
    \   return f\"blocked:{type(e).__name__}\"\n    finally:\n        s.close()\n\n\
    \ndef try_write_root():\n    try:\n        with open(\"/etc/mlscan_pwn\", \"w\"\
    ) as fh:\n            fh.write(\"x\")\n        return \"write_ok\"\n    except\
    \ Exception as e:  # noqa: BLE001\n        return f\"blocked:{type(e).__name__}\"\
    \n\n\ndef try_shadow():\n    try:\n        open(\"/etc/shadow\").read()\n    \
    \    return \"read_ok\"\n    except Exception as e:  # noqa: BLE001\n        return\
    \ f\"blocked:{type(e).__name__}\"\n\n\ndef caps_effective():\n    try:\n     \
    \   for line in open(\"/proc/self/status\"):\n            if line.startswith(\"\
    CapEff:\"):\n                return line.split()[1]\n    except Exception:  #\
    \ noqa: BLE001\n        pass\n    return \"unknown\"\n\n\ndef main() -> int:\n\
    \    checks = []\n\n    def add(name, observed, ok):\n        checks.append({\"\
    check\": name, \"observed\": observed, \"ok\": ok})\n\n    sa = \"/var/run/secrets/kubernetes.io/serviceaccount/token\"\
    \n    add(\"no_serviceaccount_token\", \"absent\" if not os.path.exists(sa) else\
    \ \"present\",\n        not os.path.exists(sa))\n    add(\"rootfs_readonly\",\
    \ try_write_root(), try_write_root().startswith(\"blocked\"))\n    add(\"external_egress_blocked\"\
    , try_external(), try_external().startswith(\"blocked\"))\n    add(\"sinkhole_reachable\"\
    , try_sinkhole(), try_sinkhole() == \"connect_ok\")\n    add(\"shadow_unreadable\"\
    , try_shadow(), try_shadow().startswith(\"blocked\"))\n    add(\"no_docker_sock\"\
    , \"absent\" if not os.path.exists(\"/var/run/docker.sock\") else \"present\"\
    ,\n        not os.path.exists(\"/var/run/docker.sock\"))\n    ce = caps_effective()\n\
    \    add(\"no_capabilities\", ce, ce in (\"0000000000000000\", \"0\"))\n\n   \
    \ kernel = os.uname().release\n    all_ok = all(c[\"ok\"] for c in checks)\n \
    \   print(json.dumps({\"kernel\": kernel, \"uid\": os.getuid(), \"checks\": checks,\n\
    \                      \"all_ok\": all_ok}, ensure_ascii=False, indent=2))\n \
    \   return 0 if all_ok else 1\n\n\nif __name__ == \"__main__\":\n    sys.exit(main())\n"
