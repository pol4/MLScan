data:
  harness.py: "# -*- coding: utf-8 -*-\n\"\"\"In-container harness: \u043D\u0430\u0431\
    \u043B\u044E\u0434\u0430\u0435\u043C\u0430\u044F \u0434\u0435\u0441\u0435\u0440\
    \u0438\u0430\u043B\u0438\u0437\u0430\u0446\u0438\u044F + \u043F\u043E\u0432\u0435\
    \u0434\u0435\u043D\u0447\u0435\u0441\u043A\u0438\u0439 probe.\n\n\u041C\u043E\u0434\
    \u0435\u043B\u044C \u043F\u0440\u0438\u043D\u0438\u043C\u0430\u0435\u0442\u0441\
    \u044F \u043F\u043E stdin (\u043D\u0438\u043A\u0430\u043A\u0438\u0445 \u0440\u0430\
    \u0441\u0448\u0430\u0440\u0435\u043D\u043D\u044B\u0445 \u043A\u0430\u0442\u0430\
    \u043B\u043E\u0433\u043E\u0432), \u0440\u0435\u0437\u0443\u043B\u044C\u0442\u0430\
    \u0442 \u2014 \u0432 stdout\n\u0441\u0442\u0440\u043E\u043A\u043E\u0439 \u0441\
    \ \u043C\u0430\u0440\u043A\u0435\u0440\u043E\u043C RESULT_MARKER. sys.argv: [0]='-c',\
    \ [1]=base64-\u0431\u0443\u0442\u0441\u0442\u0440\u0430\u043F (\u043D\u0435 \u0438\
    \u0441\u043F\u043E\u043B\u044C\u0437\u0443\u0435\u0442\u0441\u044F\n\u0437\u0434\
    \u0435\u0441\u044C), [2]=fmt, [3]=\u0438\u043C\u044F \u0444\u0430\u0439\u043B\u0430\
    \ (\u0434\u043B\u044F \u043A\u043E\u0440\u0440\u0435\u043A\u0442\u043D\u043E\u0433\
    \u043E \u0432\u044B\u0431\u043E\u0440\u0430 \u0437\u0430\u0433\u0440\u0443\u0437\
    \u0447\u0438\u043A\u0430 \u043F\u043E \u0440\u0430\u0441\u0448\u0438\u0440\u0435\
    \u043D\u0438\u044E).\n\"\"\"\nimport io\nimport json\nimport os\nimport re\nimport\
    \ shutil\nimport sys\nimport tempfile\nimport time\nimport zipfile\n\n# \u0421\
    \u043E\u0432\u043C\u0435\u0441\u0442\u0438\u043C\u043E\u0441\u0442\u044C \u0441\
    \ pickle \u0432 \u0441\u0442\u0438\u043B\u0435 Python 2 (\u043C\u043E\u0434\u0443\
    \u043B\u044C __builtin__) \u2014 \u0447\u0442\u043E\u0431\u044B \u0432\u0440\u0435\
    \u0434\u043E\u043D\u043E\u0441\u043D\u044B\u0439\n# payload \u0434\u0435\u0439\
    \u0441\u0442\u0432\u0438\u0442\u0435\u043B\u044C\u043D\u043E \u0414\u041E\u0421\
    \u0422\u0418\u0413 \u0438\u0441\u043F\u043E\u043B\u043D\u0435\u043D\u0438\u044F\
    \ \u0438 \u0434\u0430\u043B \u0434\u0438\u043D\u0430\u043C\u0438\u0447\u0435\u0441\
    \u043A\u0438\u0435 \u0441\u0438\u0433\u043D\u0430\u043B\u044B.\ntry:\n    import\
    \ builtins as _builtins\n    sys.modules.setdefault(\"__builtin__\", _builtins)\n\
    except Exception:\n    pass\ntry:\n    import copyreg as _copyreg\n    sys.modules.setdefault(\"\
    copy_reg\", _copyreg)\nexcept Exception:\n    pass\ntry:\n    import pickle as\
    \ _pickle_mod\n    sys.modules.setdefault(\"cPickle\", _pickle_mod)\nexcept Exception:\n\
    \    pass\n\n# \u041F\u043E\u0434\u0434\u0435\u0440\u0436\u043A\u0430 \u0434\u0432\
    \u0443\u0445 \u0441\u043F\u043E\u0441\u043E\u0431\u043E\u0432 \u0437\u0430\u043F\
    \u0443\u0441\u043A\u0430:\n#   * base64-\u0431\u0443\u0442\u0441\u0442\u0440\u0430\
    \u043F (docker PoC): sys.argv = ['-c', <b64>, fmt, name]\n#   * \u043F\u0440\u044F\
    \u043C\u043E\u0439 \u0437\u0430\u043F\u0443\u0441\u043A (Kubernetes Job): sys.argv\
    \ = ['harness.py', fmt, name]\n_args = sys.argv[1:]\nNAME = _args[-1] if _args\
    \ else \"sample.pkl\"\nFMT = _args[-2] if len(_args) >= 2 else \"pickle\"\nNONCE\
    \ = os.environ.get(\"MLSCAN_NONCE\", \"\").strip()\n# \u041C\u0430\u0440\u043A\
    \u0435\u0440\u044B \u0441\u043E\u0434\u0435\u0440\u0436\u0430\u0442 \u043D\u043E\
    \u043D\u0441 \u0441\u043A\u0430\u043D\u0430: \u0441\u0435\u0440\u0432\u0438\u0441\
    \ \u043F\u0440\u0438\u043D\u0438\u043C\u0430\u0435\u0442 \u0422\u041E\u041B\u042C\
    \u041A\u041E \u0441\u0442\u0440\u043E\u043A\u0438 \u0441\u043E \u0441\u0432\u043E\
    \u0438\u043C \u043D\u043E\u043D\u0441\u043E\u043C, \u043F\u043E\u044D\u0442\u043E\
    \u043C\u0443\n# payload \u043D\u0435 \u043C\u043E\u0436\u0435\u0442 \u043F\u043E\
    \u0434\u0434\u0435\u043B\u0430\u0442\u044C \u0440\u0435\u0437\u0443\u043B\u044C\
    \u0442\u0430\u0442, \u043D\u0430\u043F\u0435\u0447\u0430\u0442\u0430\u0432 \xAB\
    \u0447\u0438\u0441\u0442\u044B\u0439\xBB JSON \u0432 stdout.\nRESULT_MARKER =\
    \ (\"MLSCAN_RESULT_JSON:\" + NONCE + \":\") if NONCE else \"MLSCAN_RESULT_JSON:\"\
    \nSUMMARY_MARKER = (\"MLSCAN_SUMMARY:\" + NONCE + \":\") if NONCE else \"MLSCAN_SUMMARY:\"\
    \n\n\ndef recv_target(name):\n    \"\"\"\u041F\u0440\u0438\u043D\u0438\u043C\u0430\
    \u0435\u0442 \u043C\u043E\u0434\u0435\u043B\u044C \u0438\u0437 stdin \u0438 \u0441\
    \u043E\u0445\u0440\u0430\u043D\u044F\u0435\u0442 \u0435\u0451 \u0432 tmpfs-\u043A\
    \u0430\u0442\u0430\u043B\u043E\u0433 \u043A\u043E\u043D\u0442\u0435\u0439\u043D\
    \u0435\u0440\u0430.\"\"\"\n    d = tempfile.mkdtemp(prefix=\"mlscan-in-\", dir=\"\
    /tmp\")\n    path = os.path.join(d, os.path.basename(name) or \"sample.pkl\")\n\
    \    with open(path, \"wb\") as fh:\n        shutil.copyfileobj(sys.stdin.buffer,\
    \ fh, 1 << 20)\n    return path\n\nphase = [\"setup\"]\n_record = True\nevents\
    \ = []\nMAX_EVENTS = 5000\n\nINTERESTING = {\n    \"open\", \"os.system\", \"\
    os.exec\", \"os.spawn\", \"os.posix_spawn\", \"subprocess.Popen\",\n    \"socket.connect\"\
    , \"socket.connect_ex\", \"socket.bind\", \"socket.getaddrinfo\",\n    \"socket.gethostbyname\"\
    , \"socket.gethostbyaddr\", \"socket.sendto\", \"socket.__new__\",\n    \"ctypes.dlopen\"\
    , \"ctypes.dlsym\", \"ctypes.call_function\",\n    \"import\", \"exec\", \"compile\"\
    , \"marshal.load\", \"marshal.loads\",\n    \"runpy.run_module\", \"runpy.run_path\"\
    , \"os.chdir\",\n    \"os.mkdir\", \"os.remove\", \"os.rename\", \"os.link\",\
    \ \"os.symlink\",\n    \"shutil.copyfile\", \"shutil.copytree\", \"shutil.move\"\
    ,\n    \"urllib.Request\", \"ftplib.connect\", \"smtplib.connect\",\n}\n\n\ndef\
    \ _short(x, n=300):\n    try:\n        s = repr(x)\n    except Exception:\n  \
    \      s = \"<unrepr>\"\n    return s if len(s) <= n else s[:n] + (\"...<%d>\"\
    \ % len(s))\n\n\nLIB_PREFIXES = tuple(p for p in (getattr(sys, \"prefix\", \"\"\
    ), getattr(sys, \"base_prefix\", \"\")) if p)\n\n\ndef _is_lib_code(filename):\n\
    \    \"\"\"\u041E\u0442\u043B\u0438\u0447\u0430\u0435\u0442 \u043A\u043E\u0434\
    \ \u0431\u0438\u0431\u043B\u0438\u043E\u0442\u0435\u043A/\u0438\u043C\u043F\u043E\
    \u0440\u0442-\u043C\u0430\u0448\u0438\u043D\u044B \u043E\u0442 \u043A\u043E\u0434\
    \u0430 \u043F\u043E\u043B\u0435\u0437\u043D\u043E\u0439 \u043D\u0430\u0433\u0440\
    \u0443\u0437\u043A\u0438.\"\"\"\n    try:\n        fn = str(filename or \"\")\n\
    \    except Exception:\n        return True\n    if fn.startswith(\"<\"):\n  \
    \      return fn not in (\"<string>\", \"<stdin>\")\n    if \"site-packages\"\
    \ in fn or \"dist-packages\" in fn:\n        return True\n    return any(p and\
    \ fn.startswith(p) for p in LIB_PREFIXES)\n\n\ndef _norm(event, args):\n    \"\
    \"\"\u041D\u043E\u0440\u043C\u0430\u043B\u0438\u0437\u0430\u0446\u0438\u044F \u0430\
    \u0440\u0433\u0443\u043C\u0435\u043D\u0442\u043E\u0432: \u0443\u0431\u0438\u0440\
    \u0430\u0435\u043C \u0448\u0443\u043C, \u043E\u0441\u0442\u0430\u0432\u043B\u044F\
    \u0435\u043C \u0437\u043D\u0430\u0447\u0438\u043C\u043E\u0435.\"\"\"\n    try:\n\
    \        if event == \"open\":\n            return [_short(args[0], 200), _short(args[1],\
    \ 16)]\n        if event == \"import\":\n            return [_short(args[0], 120),\
    \ _short(args[1], 120)]\n        if event in (\"exec\", \"compile\"):\n      \
    \      return [_short(args[0], 160)]\n        return [_short(a, 200) for a in\
    \ args]\n    except Exception:\n        return [\"<norm-error>\"]\n\n\ndef hook(event,\
    \ args):\n    if not _record or event not in INTERESTING or len(events) >= MAX_EVENTS:\n\
    \        return\n    try:\n        if event == \"exec\":\n            co = args[0]\
    \ if args else None\n            if co is None or _is_lib_code(getattr(co, \"\
    co_filename\", \"\")):\n                return\n        elif event == \"compile\"\
    :\n            if len(args) > 1 and _is_lib_code(args[1]):\n                return\n\
    \        elif event == \"marshal.loads\":\n            return  # \u0448\u0443\u043C\
    \ \u0437\u0430\u0433\u0440\u0443\u0437\u0447\u0438\u043A\u0430 .pyc\n        events.append({\"\
    t\": round(time.monotonic(), 4), \"phase\": phase[0],\n                      \
    \ \"event\": event, \"args\": _norm(event, args)})\n    except Exception:\n  \
    \      pass\n\n\n\ndef unpickle_bytes(data, errors):\n    import pickle\n    try:\n\
    \        return pickle.loads(data, fix_imports=True, encoding=\"latin1\")\n  \
    \  except Exception as e:\n        errors.append(\"pickle.loads: %s: %s\" % (type(e).__name__,\
    \ e))\n    try:\n        class Probe(pickle.Unpickler):\n            def find_class(self,\
    \ module, name):\n                try:\n                    import importlib\n\
    \                    return getattr(importlib.import_module(module), name)\n \
    \               except Exception as e:\n                    raise RuntimeError(\"\
    find_class %s.%s: %s\" % (module, name, e))\n        return Probe(io.BytesIO(data)).load()\n\
    \    except Exception as e:\n        errors.append(\"probe.load: %s: %s\" % (type(e).__name__,\
    \ e))\n    return None\n\n\ndef load_zip(data, errors):\n    objs = []\n    try:\n\
    \        zf = zipfile.ZipFile(io.BytesIO(data))\n    except Exception as e:\n\
    \        errors.append(\"zip: %s: %s\" % (type(e).__name__, e))\n        return\
    \ None\n    for name in zf.namelist():\n        low = name.lower()\n        try:\n\
    \            member = zf.read(name)\n        except Exception as e:\n        \
    \    errors.append(\"member %s: %s\" % (name, e))\n            continue\n    \
    \    if not (low.endswith((\".pkl\", \".pickle\", \".joblib\", \".pt\")) or member[:2]\
    \ == b\"\\x80\"):\n            continue\n        objs.append({\"member\": name,\
    \ \"value\": unpickle_bytes(member, errors)})\n    return objs or None\n\n\ndef\
    \ npy_payload(data):\n    if not data.startswith(b\"\\x93NUMPY\") or len(data)\
    \ < 10:\n        return data\n    if data[6] == 1:\n        off = 10 + int.from_bytes(data[8:10],\
    \ \"little\")\n    else:\n        off = 12 + int.from_bytes(data[8:12], \"little\"\
    )\n    return data[off:]\n\n\ndef _run_model_code(path, errors):\n    \"\"\"\u0418\
    \u0441\u043F\u043E\u043B\u043D\u044F\u0435\u0442 entry-\u043A\u043E\u0434 model-as-code\
    \ (handler.py/model.py) \u0432 \u043F\u0435\u0441\u043E\u0447\u043D\u0438\u0446\
    \u0435.\"\"\"\n    import zipfile\n    code = None\n    if zipfile.is_zipfile(path):\n\
    \        try:\n            zf = zipfile.ZipFile(path)\n            cands = [n\
    \ for n in zf.namelist() if n.lower().endswith(\".py\")]\n            cands.sort(key=lambda\
    \ n: (0 if \"handler\" in n.lower() else 1 if \"model\" in n.lower() else 2))\n\
    \            if cands:\n                code = zf.read(cands[0]).decode(\"utf-8\"\
    , \"replace\")\n        except Exception as e:\n            errors.append(\"model-as-code\
    \ zip: %s\" % e)\n    else:\n        try:\n            code = open(path, \"rb\"\
    ).read().decode(\"utf-8\", \"replace\")\n        except Exception as e:\n    \
    \        errors.append(\"model-as-code read: %s\" % e)\n    if code is None:\n\
    \        # \u041F\u0430\u043A\u0435\u0442 \u0431\u0435\u0437 entry-\u043A\u043E\
    \u0434\u0430 (\u043D\u0430\u043F\u0440\u0438\u043C\u0435\u0440 TorchServe .mar\
    \ \u0442\u043E\u043B\u044C\u043A\u043E \u0441 \u0432\u0435\u0441\u0430\u043C\u0438\
    ) \u2014 \u044D\u0442\u043E \u043A\u043E\u043D\u0442\u0435\u0439\u043D\u0435\u0440\
    ,\n        # \u0430 \u043D\u0435 \u043E\u0448\u0438\u0431\u043A\u0430 \u0437\u0430\
    \u0433\u0440\u0443\u0437\u043A\u0438: \u043F\u0435\u0440\u0435\u0447\u0438\u0441\
    \u043B\u044F\u0435\u043C \u0441\u043E\u0434\u0435\u0440\u0436\u0438\u043C\u043E\
    \u0435.\n        if zipfile.is_zipfile(path):\n            return _load_archive(path,\
    \ errors, \"zip\")\n        errors.append(\"model-as-code: entry-\u043A\u043E\u0434\
    \ \u043D\u0435 \u043D\u0430\u0439\u0434\u0435\u043D\")\n        return None\n\
    \    g = {\"__name__\": \"__main__\", \"__file__\": path}\n    exec(compile(code,\
    \ \"<artifact>\", \"exec\"), g)  # \u043D\u0430\u043C\u0435\u0440\u0435\u043D\u043D\
    \u043E: \u043F\u0440\u043E\u0432\u0435\u0440\u044F\u0435\u043C \u043F\u043E\u0432\
    \u0435\u0434\u0435\u043D\u0438\u0435 payload\n    return {\"executed\": \"model-as-code\"\
    }\n\n\ndef _prod(seq):\n    n = 1\n    for x in seq:\n        n *= int(x)\n  \
    \  return n\n\n\ndef _load_safetensors(path, errors):\n    \"\"\"\u0427\u0442\u0435\
    \u043D\u0438\u0435 SafeTensors \u0447\u0435\u0440\u0435\u0437 mmap: \u043A\u043B\
    \u044E\u0447\u0438/\u0444\u043E\u0440\u043C\u044B/dtype + \u043F\u0440\u043E\u0432\
    \u0435\u0440\u043A\u0430 NaN/Inf.\"\"\"\n    import numpy as np\n    from safetensors\
    \ import safe_open\n    info = {\"tensors\": {}, \"count\": 0, \"nan\": 0, \"\
    inf\": 0}\n    with safe_open(path, framework=\"numpy\") as f:\n        keys =\
    \ list(f.keys())\n        for k in keys[:128]:\n            t = f.get_tensor(k)\n\
    \            info[\"tensors\"][k] = {\"shape\": list(t.shape), \"dtype\": str(t.dtype)}\n\
    \            info[\"count\"] += 1\n            if getattr(t.dtype, \"kind\", \"\
    \") == \"f\":\n                try:\n                    if bool(np.isnan(t).any()):\n\
    \                        info[\"nan\"] += 1\n                    if bool(np.isinf(t).any()):\n\
    \                        info[\"inf\"] += 1\n                except Exception:\n\
    \                    pass\n    return info\n\n\ndef _load_onnx(path, errors):\n\
    \    \"\"\"\u0417\u0430\u0433\u0440\u0443\u0437\u043A\u0430 ONNX \u0447\u0435\u0440\
    \u0435\u0437 onnxruntime + \u043F\u0440\u043E\u0431\u043D\u044B\u0439 \u0438\u043D\
    \u0444\u0435\u0440\u0435\u043D\u0441 \u043D\u0430 \u043D\u0443\u043B\u0435\u0432\
    \u044B\u0445 \u0434\u0430\u043D\u043D\u044B\u0445.\"\"\"\n    import numpy as\
    \ np\n    import onnxruntime as ort\n    so = ort.SessionOptions()\n    so.graph_optimization_level\
    \ = ort.GraphOptimizationLevel.ORT_DISABLE_ALL\n    sess = ort.InferenceSession(path,\
    \ so, providers=[\"CPUExecutionProvider\"])\n    inputs = [{\"name\": i.name,\
    \ \"shape\": list(i.shape), \"type\": i.type} for i in sess.get_inputs()]\n  \
    \  outputs = [{\"name\": o.name, \"shape\": list(o.shape), \"type\": o.type} for\
    \ o in sess.get_outputs()]\n    info = {\"inputs\": inputs, \"outputs\": outputs,\
    \ \"inference\": None}\n    try:\n        feed = {}\n        for i in sess.get_inputs():\n\
    \            if i.type != \"tensor(float)\":\n                continue\n     \
    \       shape = [d if isinstance(d, int) and d > 0 else 1 for d in i.shape]\n\
    \            if _prod(shape) > 1000000:\n                continue\n          \
    \  feed[i.name] = np.zeros(shape, dtype=\"float32\")\n        if feed and len(feed)\
    \ == len(sess.get_inputs()):\n            outs = sess.run(None, feed)\n      \
    \      info[\"inference\"] = [{\"shape\": list(getattr(o, \"shape\", []))} for\
    \ o in outs[:3]]\n    except Exception as e:\n        errors.append(\"onnx inference:\
    \ %s: %s\" % (type(e).__name__, e))\n    return info\n\n\ndef _load_hdf5(path,\
    \ errors):\n    \"\"\"\u0427\u0442\u0435\u043D\u0438\u0435 HDF5 (\u0432 \u0442\
    .\u0447. \u0432\u0435\u0441\u043E\u0432): \u0434\u0430\u0442\u0430\u0441\u0435\
    \u0442\u044B/\u0444\u043E\u0440\u043C\u044B/dtype + \u0430\u0442\u0440\u0438\u0431\
    \u0443\u0442\u044B.\"\"\"\n    import h5py\n    info = {\"datasets\": [], \"count\"\
    : 0, \"attrs\": []}\n    with h5py.File(path, \"r\") as f:\n        def visit(name,\
    \ obj):\n            if isinstance(obj, h5py.Dataset) and info[\"count\"] < 256:\n\
    \                info[\"datasets\"].append({\"name\": name, \"shape\": list(obj.shape),\n\
    \                                         \"dtype\": str(obj.dtype)})\n      \
    \          info[\"count\"] += 1\n        f.visititems(visit)\n        try:\n \
    \           info[\"attrs\"] = sorted(list(f.attrs.keys()))[:32]\n        except\
    \ Exception:\n            pass\n        # \u0432\u043D\u0435\u0448\u043D\u0438\
    \u0435 \u0441\u0441\u044B\u043B\u043A\u0438 (external links) \u2014 \u0440\u0438\
    \u0441\u043A \u043F\u043E\u0434\u0442\u044F\u0433\u0438\u0432\u0430\u043D\u0438\
    \u044F \u0434\u0430\u043D\u043D\u044B\u0445/\u043A\u043E\u0434\u0430 \u0438\u0437\
    \u0432\u043D\u0435\n        ext = []\n\n        def _links(group, prefix=\"\"\
    ):\n            for key in list(group.keys()):\n                try:\n       \
    \             link = group.get(key, getlink=True)\n                except Exception:\n\
    \                    continue\n                if isinstance(link, h5py.ExternalLink):\n\
    \                    ext.append(\"%s%s -> %s\" % (prefix, key, link.filename))\n\
    \                elif isinstance(link, h5py.Group):\n                    _links(group[key],\
    \ prefix + key + \"/\")\n\n        try:\n            _links(f)\n        except\
    \ Exception:\n            pass\n        info[\"external_links\"] = ext[:16]\n\
