# RBAC сервиса тестирования для LLM-job'ов в t-mlscan-gpu (создание/чтение/удаление job'ов
# и их подов — чтобы при завершении/ошибке освобождать GPU и не оставлять «мусор»).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mlscan-testing-gpu
  namespace: t-mlscan-gpu
rules:
  - {apiGroups: [""], resources: ["configmaps"], verbs: ["create", "delete", "get", "list"]}
  - {apiGroups: [""], resources: ["pods"], verbs: ["get", "list", "delete"]}
  - {apiGroups: [""], resources: ["pods/log"], verbs: ["get", "list"]}
  - {apiGroups: ["batch"], resources: ["jobs"], verbs: ["create", "get", "delete", "list"]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mlscan-testing-gpu
  namespace: t-mlscan-gpu
subjects:
  - {kind: ServiceAccount, name: mlscan-testing, namespace: t-mlscan-app}
roleRef: {kind: Role, name: mlscan-testing-gpu, apiGroup: rbac.authorization.k8s.io}
