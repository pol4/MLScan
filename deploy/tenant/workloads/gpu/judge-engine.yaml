# Доверенная модель-судья (v4): отдельный движок-судья под kata-gpu.
#
# Зачем: judge может быть «внешним» движком (не тем, что тестируется) — см. Arch_v4/14 §4 `url`.
# Сервис тестирования указывает на него в настройках
#   POST /v4/judge {"url": "http://mlscan-judge-engine.t-mlscan-gpu.svc:8000", "model": "m"}
# и probe оценивает ответы через него (`mode=external`), а не self-judge.
#
# Почему Job, а не Deployment: под kata-gpu Deployment с restartPolicy=Always после старта
# контейнера падает на QEMU memory-hotplug ("no slots … duplicate property 'hotplugged-0'").
# Job с restartPolicy=Never создаёт свежую микро-ВМ (как и job'ы тестов) — проверенный путь.
#
# ВАЖНО (ресурсы): занимает 1 GPU; по умолчанию `suspend: true` (не запущено). Включение —
# `suspend: false` (тесты, требующие 2 GPU (TP=2), не смогут стартовать параллельно).
# Модель берётся из общего кэша моделей `/cache/<sha256>/files` (read-only, без скачивания).
#
# ПРОВЕРЕНО (стенд): под `kata-gpu` движок стартует и отвечает `/v1/models`, `/v1/chat/completions`;
# в микро-ВМ видны `/dev/nvidia*` (GPU passthrough). `runAsNonRoot` обязателен на уровне КОНТЕЙНЕРА
# (Kyverno `require-nonroot-except-agent`), иначе Job отклоняется.
#
# ОГРАНИЧЕНИЕ (инфра): на узле с 2 GPU параллельный GPU-прогон теста не стартует (вторая kata-ВМ с GPU
# застревает в PodInitializing) → «внешняя» судья требует **свободный GPU**; host-runtime (`nvidia`)
# запрещён admission-политикой тенанта (инвариант: только kata-профили).
apiVersion: batch/v1
kind: Job
metadata:
  name: mlscan-judge-engine
  namespace: t-mlscan-gpu
  labels:
    app.kubernetes.io/part-of: mlscan
    app: mlscan-judge-engine
spec:
  suspend: true
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: mlscan-judge-engine
    spec:
      restartPolicy: Never
      runtimeClassName: kata-gpu
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: engine
          image: harbor.platform.rtx.local/mlscan/engine-vllm:v0.9.2@sha256:37cd5bd18d220a0f4c70401ce1d4a0cc588fbfe03cc210579428f2c47e6eac33
          command:
            - vllm
            - serve
            - /cache/169ad53ec313c3a34b06c0809216e4fc072cce444a5d4ff2b59690d064130ed5/files
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --max-model-len
            - "4096"
            - --gpu-memory-utilization
            - "0.90"
            - --swap-space
            - "0"
            - --served-model-name
            - m
          env:
            - {name: HOME, value: /tmp}
            - {name: XDG_CACHE_HOME, value: /tmp/.cache}
            - {name: TORCHINDUCTOR_CACHE_DIR, value: /tmp/torchinductor}
            - {name: TRITON_CACHE_DIR, value: /tmp/triton}
          ports:
            - {name: openai, containerPort: 8000}
          resources:
            limits:
              # GPU как у job'ов тестов: MLSCAN_GPU_MODE=device-plugin → nvidia.com/gpu.
              # cpu/memory НЕ задаём (kata-gpu: VM-память из limits → ошибка QEMU hotplug).
              nvidia.com/gpu: 1
              ephemeral-storage: 20Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: false
          volumeMounts:
            - {name: cache, mountPath: /cache, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: cache
          persistentVolumeClaim: {claimName: mlscan-model-cache, readOnly: true}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mlscan-judge-engine
  namespace: t-mlscan-gpu
  labels:
    app.kubernetes.io/part-of: mlscan
    app: mlscan-judge-engine
spec:
  selector:
    app: mlscan-judge-engine
  ports:
    - {name: openai, port: 8000, targetPort: 8000}
