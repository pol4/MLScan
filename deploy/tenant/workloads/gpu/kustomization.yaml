apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The LLM test path runs in t-mlscan-gpu and mounts the same deception/honeypot
# and in-guest observer ConfigMaps that the scan sandbox uses. They were created
# out-of-band there, so ArgoCD saw the t-mlscan-gpu copies as untracked (OutOfSync).
# Re-declaring the shared ConfigMaps in this namespace makes ArgoCD manage them.
#
# The ConfigMap payloads mirror ../sandbox/*.yaml (identical data, GPU namespace).
resources:
  - deception.yaml
  - ebpf-agent.yaml
  - sgl-shim.yaml
  - model-cache.yaml
  - model-cache-gc.yaml
  - judge-engine.yaml
