apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlscan-integrations
  namespace: t-mlscan-app
  labels: {app: mlscan-integrations, app.kubernetes.io/part-of: mlscan}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: mlscan-integrations}
  template:
    metadata:
      labels: {app: mlscan-integrations}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: harbor-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: integrations
          image: harbor.platform.rtx.local/mlscan/services@sha256:4c413d65b26e5bf7950b11ccf21e2846213693c370dc9579f71f3d6533923369
          imagePullPolicy: IfNotPresent
          command: ["python", "/opt/svc/mlscan_integrations.py"]
          env:
            - {name: ANALYTICS_URL, value: "http://mlscan-analytics.t-mlscan-app.svc.cluster.local:8080"}
            - {name: TESTING_URL, value: "http://mlscan-testing.t-mlscan-app.svc.cluster.local:8080"}
            - {name: DATA_DIR, value: /data}
            - {name: INTEL_PATH, value: /etc/mlscan/intel.json}
            - {name: PORT, value: "8080"}
            - {name: POLL_INTERVAL, value: "20"}
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
            - {name: MLSCAN_LANG, value: "ru"}
            - {name: PYTHONUTF8, value: "1"}
            - {name: TMPDIR, value: /tmp}
            - name: MLSCAN_KEYS
              valueFrom: {secretKeyRef: {name: mlscan-keys, key: MLSCAN_KEYS}}
            - name: INTERNAL_KEY
              valueFrom: {secretKeyRef: {name: mlscan-keys, key: INTERNAL_KEY}}
            - {name: MLSCAN_COOKIE_DOMAIN, value: ".platform.rtx.local"}
            - name: MLSCAN_SESSION_SECRET
              valueFrom: {secretKeyRef: {name: mlscan-keys, key: SESSION_SECRET}}
            - name: PGHOST
              valueFrom: {secretKeyRef: {name: mlscan-pg, key: PGHOST}}
            - name: PGPORT
              valueFrom: {secretKeyRef: {name: mlscan-pg, key: PGPORT}}
            - name: PGUSER
              valueFrom: {secretKeyRef: {name: mlscan-pg, key: PGUSER}}
            - name: PGDATABASE
              valueFrom: {secretKeyRef: {name: mlscan-pg, key: PGDATABASE}}
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: mlscan-pg, key: PGPASSWORD}}
          ports:
            - {name: http, containerPort: 8080}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
            limits: {cpu: "500m", memory: "512Mi"}
          volumeMounts:
            - {name: intel, mountPath: /etc/mlscan, readOnly: true}
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: intel, configMap: {name: mlscan-intel}}
        - {name: data, persistentVolumeClaim: {claimName: mlscan-integrations-data}}
        - {name: tmp, emptyDir: {sizeLimit: 128Mi, medium: Memory}}
---
apiVersion: v1
kind: Service
metadata:
  name: mlscan-integrations
  namespace: t-mlscan-app
  labels: {app: mlscan-integrations}
spec:
  type: ClusterIP
  selector: {app: mlscan-integrations}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
