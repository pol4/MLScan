apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlscan-ops
  namespace: t-mlscan-app
  labels: {app: mlscan-ops, app.kubernetes.io/part-of: mlscan}
spec:
  replicas: 1
  selector:
    matchLabels: {app: mlscan-ops}
  template:
    metadata:
      labels: {app: mlscan-ops}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: harbor-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: ops
          image: harbor.platform.rtx.local/mlscan/services@sha256:4b3c729a88d90dcb86bca4d885db8add04cbca95bff9ca27166d44481acc72dc
          imagePullPolicy: IfNotPresent
          command: ["python", "/opt/svc/mlscan_ops.py"]
          env:
            - {name: ANALYTICS_URL, value: "http://mlscan-analytics.t-mlscan-app.svc.cluster.local:8080"}
            - {name: TESTING_URL, value: "http://mlscan-testing.t-mlscan-app.svc.cluster.local:8080"}
            - {name: INTEGRATIONS_URL, value: "http://mlscan-integrations.t-mlscan-app.svc.cluster.local:8080"}
            - {name: GOLDEN_PATH, value: /etc/mlscan/golden.json}
            - {name: SAMPLES_DIR, value: /samples}
            - {name: PORT, value: "8080"}
            - {name: RETEST_INTERVAL, value: "0"}
            - name: MLSCAN_KEYS
              valueFrom: {secretKeyRef: {name: mlscan-keys, key: MLSCAN_KEYS}}
            - name: INTERNAL_KEY
              valueFrom: {secretKeyRef: {name: mlscan-keys, key: INTERNAL_KEY}}
            - {name: MLSCAN_COOKIE_DOMAIN, value: ".platform.rtx.local"}
            - name: MLSCAN_SESSION_SECRET
              valueFrom: {secretKeyRef: {name: mlscan-keys, key: SESSION_SECRET}}
            - name: PGHOST
              valueFrom: {secretKeyRef: {name: mlscan-pg, key: PGHOST}}
            - name: PGPORT
              valueFrom: {secretKeyRef: {name: mlscan-pg, key: PGPORT}}
            - name: PGUSER
              valueFrom: {secretKeyRef: {name: mlscan-pg, key: PGUSER}}
            - name: PGDATABASE
              valueFrom: {secretKeyRef: {name: mlscan-pg, key: PGDATABASE}}
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: mlscan-pg, key: PGPASSWORD}}
            - {name: GARAGE_ADMIN_URL, value: ""}
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
            - {name: MLSCAN_LANG, value: "ru"}
            - {name: PYTHONUTF8, value: "1"}
            - {name: TMPDIR, value: /tmp}
          ports:
            - {name: http, containerPort: 8080}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: {cpu: "50m", memory: "96Mi"}
            limits: {cpu: "300m", memory: "256Mi"}
          volumeMounts:
            - {name: golden, mountPath: /etc/mlscan, readOnly: true}
            - {name: samples, mountPath: /samples, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: golden, configMap: {name: mlscan-golden}}
        - {name: samples, configMap: {name: mlscan-golden-samples}}
        - {name: tmp, emptyDir: {sizeLimit: 64Mi, medium: Memory}}
---
apiVersion: v1
kind: Service
metadata:
  name: mlscan-ops
  namespace: t-mlscan-app
  labels: {app: mlscan-ops}
spec:
  type: ClusterIP
  selector: {app: mlscan-ops}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
