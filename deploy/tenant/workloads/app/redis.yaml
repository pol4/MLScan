apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlscan-redis
  namespace: t-mlscan-app
  labels: {app: mlscan-redis, app.kubernetes.io/part-of: mlscan}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: mlscan-redis}
  template:
    metadata:
      labels: {app: mlscan-redis}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: harbor-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: redis
          image: harbor.platform.rtx.local/proxy-dockerhub/library/redis:7-alpine
          imagePullPolicy: IfNotPresent
          args: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - {name: redis, containerPort: 6379}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          readinessProbe:
            tcpSocket: {port: 6379}
            initialDelaySeconds: 3
          livenessProbe:
            tcpSocket: {port: 6379}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: {cpu: "50m", memory: "64Mi"}
            limits: {cpu: "300m", memory: "128Mi"}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: data, emptyDir: {sizeLimit: 64Mi}}
        - {name: tmp, emptyDir: {sizeLimit: 16Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: mlscan-redis
  namespace: t-mlscan-app
  labels: {app: mlscan-redis}
spec:
  selector: {app: mlscan-redis}
  ports:
    - {name: redis, port: 6379, targetPort: 6379}
