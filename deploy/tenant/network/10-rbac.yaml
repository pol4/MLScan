apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mlscan-testing-sandbox
  namespace: t-mlscan-sandbox
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "delete", "get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "delete", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mlscan-testing-sandbox
  namespace: t-mlscan-sandbox
subjects:
  - kind: ServiceAccount
    name: mlscan-testing
    namespace: t-mlscan-app
roleRef:
  kind: Role
  name: mlscan-testing-sandbox
  apiGroup: rbac.authorization.k8s.io
