apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: t-mlscan-sandbox
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: t-mlscan-sandbox
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-artifact-egress
  namespace: t-mlscan-sandbox
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: t-mlscan-app
          podSelector:
            matchLabels:
              app: mlscan-testing
      ports:
        - {protocol: TCP, port: 8090}
        - {protocol: TCP, port: 8080}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-sinkhole-egress
  namespace: t-mlscan-sandbox
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: sinkhole
      ports:
        - {protocol: TCP, port: 8080}
        - {protocol: TCP, port: 4444}
        - {protocol: TCP, port: 9001}
        - {protocol: TCP, port: 1337}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-sinkhole-ingress
  namespace: t-mlscan-sandbox
spec:
  podSelector:
    matchLabels:
      app: sinkhole
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - {protocol: TCP, port: 8080}
        - {protocol: TCP, port: 4444}
        - {protocol: TCP, port: 9001}
        - {protocol: TCP, port: 1337}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-artifacts-proxy-egress
  namespace: t-mlscan-sandbox
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: mlscan-artifacts-proxy
      ports:
        - {protocol: TCP, port: 8090}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-artifacts-proxy-ingress
  namespace: t-mlscan-sandbox
spec:
  podSelector:
    matchLabels:
      app: mlscan-artifacts-proxy
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - {protocol: TCP, port: 8090}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-s3-rgw-egress
  namespace: t-mlscan-sandbox
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: rook-ceph
      ports:
        - {protocol: TCP, port: 8080}
        - {protocol: TCP, port: 80}
