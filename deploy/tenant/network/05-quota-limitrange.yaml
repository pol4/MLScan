apiVersion: v1
kind: ResourceQuota
metadata:
  name: tenant-quota
  namespace: t-mlscan-sandbox
spec:
  hard:
    requests.cpu: "16"
    requests.memory: 32Gi
    limits.cpu: "32"
    limits.memory: 64Gi
    requests.nvidia.com/gpu: "2"
    limits.nvidia.com/gpu: "2"
    requests.ephemeral-storage: 200Gi
    limits.ephemeral-storage: 400Gi
    count/jobs.batch: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: tenant-defaults
  namespace: t-mlscan-sandbox
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
