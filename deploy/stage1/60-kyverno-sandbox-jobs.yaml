# P1-3: ограничение Job'ов в namespace песочницы (Kyverno).
# Любой Job в mlscan-sandbox обязан: исполняться в Kata, использовать наш образ песочницы
# ПО DIGEST, задавать безопасный securityContext и не запрашивать host* / privileged.
# Это не даёт скомпрометированному сервису (или человеку с правом create job) запустить
# произвольный код в кластере и подменить результат проверки (docs/14, P1-3).
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: mlscan-sandbox-jobs
  annotations:
    policies.kyverno.io/title: MLScan sandbox Jobs
    policies.kyverno.io/description: "Job'ы в mlscan-sandbox: kata, digest-образ песочницы, безопасный securityContext"
spec:
  validationFailureAction: Enforce
  background: false
  rules:
  - name: require-kata-and-digest-image
    match:
      any:
      - resources:
          kinds: [Job]
          namespaces: [mlscan-sandbox]
    validate:
      message: "Job в mlscan-sandbox должен использовать runtimeClassName=kata и образ mlscan-sandbox по digest"
      pattern:
        spec:
          template:
            spec:
              runtimeClassName: kata
              containers:
              - image: "*mlscan-sandbox@sha256:*"
  # Ужесточённый securityContext. Исключение по согласованию: контейнер `ebpf-agent`
  # (наш сенсор мониторинга) запускается root-в-госте с caps BPF/PERFMON — иначе в этой
  # Kata-сборке eBPF недоступен (у non-root CapEff=0 -> EPERM). Остальные контейнеры — строго non-root.
  - name: require-hardened-security-context
    match:
      any:
      - resources:
          kinds: [Job]
          namespaces: [mlscan-sandbox]
    validate:
      message: >-
        Job в mlscan-sandbox: все контейнеры кроме `ebpf-agent` должны быть non-root;
        у всех — drop ALL, no-priv-escalation, RO-FS, seccomp; pod — без service account токена
      deny:
        conditions:
          all:
          # 1) нельзя добавлять capabilities никому, кроме ebpf-agent (BPF/PERFMON проверяет guard-политика)
          - key: "{{ request.object.spec.template.spec.containers[?name!='ebpf-agent'].securityContext.capabilities.add[] | length(@) }}"
            operator: GreaterThan
            value: 0
          # 2) никто кроме ebpf-agent не может быть root
          - key: "{{ request.object.spec.template.spec.containers[?name!='ebpf-agent'].securityContext.runAsNonRoot | [?@ != `true`] | length(@) }}"
            operator: GreaterThan
            value: 0
          # 3) у всех контейнеров: no-priv-escalation, RO-FS, drop ALL
          - key: "{{ request.object.spec.template.spec.containers[?securityContext.allowPrivilegeEscalation!='false'].securityContext.allowPrivilegeEscalation }}"
            operator: AnyIn
            value: ["true", "True", 1, "1"]
          - key: "{{ request.object.spec.template.spec.containers[?securityContext.readOnlyRootFilesystem!='true'].securityContext.readOnlyRootFilesystem }}"
            operator: AnyIn
            value: ["false", "False", 0, "0"]
          - key: "{{ request.object.spec.template.spec.containers[].securityContext.capabilities.drop[] | [?@ != 'ALL'] | length(@) }}"
            operator: GreaterThan
            value: 0
          # 4) pod: без service account токена и seccomp=RuntimeDefault
          - key: "{{ request.object.spec.template.spec.automountServiceAccountToken }}"
            operator: AnyIn
            value: [true, "true", "True", 1, "1"]
          - key: "{{ request.object.spec.template.spec.securityContext.seccompProfile.type }}"
            operator: NotEquals
            value: "RuntimeDefault"
