# Аналитический движок + UI (Компонента 3). stdlib-only, non-root, read-only rootfs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlscan-analytics
  namespace: mlscan-analytics
  labels: {app: mlscan-analytics, app.kubernetes.io/part-of: mlscan, mlscan.io/stage: "3"}
spec:
  replicas: 1
  selector:
    matchLabels: {app: mlscan-analytics}
  template:
    metadata:
      labels: {app: mlscan-analytics}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: analytics
        image: python:3.12-slim
        imagePullPolicy: IfNotPresent
        command: ["python", "/opt/svc/mlscan_analytics.py"]
        env:
        - {name: TESTING_URL, value: "http://mlscan-testing.mlscan-testing.svc.cluster.local:8080"}
        - {name: DATA_DIR, value: /data}
        - {name: POLICY_PATH, value: /etc/mlscan/policy.json}
        - {name: PORT, value: "8080"}
        - {name: POLL_INTERVAL, value: "15"}
        - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
        - {name: PYTHONUTF8, value: "1"}
        - {name: TMPDIR, value: /tmp}
        ports:
        - {name: http, containerPort: 8080}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: ["ALL"]}
        readinessProbe:
          httpGet: {path: /healthz, port: 8080}
          initialDelaySeconds: 3
          periodSeconds: 10
        livenessProbe:
          httpGet: {path: /healthz, port: 8080}
          initialDelaySeconds: 10
          periodSeconds: 20
        resources:
          requests: {cpu: "100m", memory: "128Mi"}
          limits: {cpu: "500m", memory: "512Mi"}
        volumeMounts:
        - {name: svc-code, mountPath: /opt/svc, readOnly: true}
        - {name: policy, mountPath: /etc/mlscan, readOnly: true}
        - {name: data, mountPath: /data}
        - {name: tmp, mountPath: /tmp}
      volumes:
      - {name: svc-code, configMap: {name: mlscan-analytics-code}}
      - {name: policy, configMap: {name: mlscan-policy}}
      - {name: data, persistentVolumeClaim: {claimName: mlscan-analytics-data}}
      - {name: tmp, emptyDir: {sizeLimit: 128Mi, medium: Memory}}
---
apiVersion: v1
kind: Service
metadata:
  name: mlscan-analytics
  namespace: mlscan-analytics
  labels: {app: mlscan-analytics}
spec:
  type: ClusterIP
  selector: {app: mlscan-analytics}
  ports:
  - {name: http, port: 8080, targetPort: 8080}
