# Append-only Evidence Store (JSONL + hash-chain) и индекс сканов.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlscan-analytics-data
  namespace: mlscan-analytics
  labels: {app.kubernetes.io/part-of: mlscan, mlscan.io/stage: "3"}
spec:
  accessModes: ["ReadWriteOnce"]
  # StorageClass локального тома (в MicroK8s по умолчанию); при переносе замените на свой
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
