# VirtualServices: маршрутизация по хостам на ClusterIP-сервисы MLScan.
# VirtualServices: маршрутизация по хостам на ClusterIP-сервисы MLScan.
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: mlscan-analytics
  namespace: mlscan-analytics
  labels: {app.kubernetes.io/part-of: mlscan, mlscan.io/stage: "ingress"}
spec:
  hosts: ["analytics.mlscan.local"]
  gateways: ["mlscan-ingress/mlscan-gateway"]
  http:
  - timeout: 24h
    route:
    - destination: {host: mlscan-analytics.mlscan-analytics.svc.cluster.local, port: {number: 8080}}

---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: mlscan-testing-api
  namespace: mlscan-testing
  labels: {app.kubernetes.io/part-of: mlscan, mlscan.io/stage: "ingress"}
spec:
  hosts: ["api.mlscan.local"]
  gateways: ["mlscan-ingress/mlscan-gateway"]
  http:
  - timeout: 24h
    route:
    - destination: {host: mlscan-testing.mlscan-testing.svc.cluster.local, port: {number: 8080}}
---
# Короткий адрес: mlscan.local -> analytics (чтобы https://mlscan.local:30921 тоже открывал UI)
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: mlscan-root
  namespace: mlscan-analytics
  labels: {app.kubernetes.io/part-of: mlscan, mlscan.io/stage: "ingress"}
spec:
  hosts: ["mlscan.local"]
  gateways: ["mlscan-ingress/mlscan-gateway"]
  http:
  - timeout: 24h
    route:
    - destination: {host: mlscan-analytics.mlscan-analytics.svc.cluster.local, port: {number: 8080}}
