# S3 наружу через Istio: TCP-passthrough gateway:31400 (nodePort 31317) -> Garage:3900.
# Нужно для прямой presigned-загрузки с АРМ/CI (вне кластера). Passthrough сохраняет Host,
# поэтому подпись SigV4 в presigned-URL проверяется корректно. TLS не терминируется здесь
# (при необходимости — отдельный TLS-listener/passthrough и внешний LB; см. docs/15 §13).
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: mlscan-s3
  namespace: mlscan-data
  labels: {app.kubernetes.io/part-of: mlscan, mlscan.io/stage: "ingress"}
spec:
  hosts: ["*"]
  gateways: ["mlscan-ingress/mlscan-gateway"]
  tcp:
  - match:
    - port: 31400
    route:
    - destination:
        host: garage.mlscan-data.svc.cluster.local
        port: {number: 3900}
