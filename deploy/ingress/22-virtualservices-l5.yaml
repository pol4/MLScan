# VirtualService уровня 5 (эксплуатация). Применяется, когда namespace mlscan-ops существует.
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: mlscan-ops
  namespace: mlscan-ops
  labels: {app.kubernetes.io/part-of: mlscan, mlscan.io/stage: "ingress"}
spec:
  hosts: ["ops.mlscan.local"]
  gateways: ["mlscan-ingress/mlscan-gateway"]
  http:
  - route:
    - destination: {host: mlscan-ops.mlscan-ops.svc.cluster.local, port: {number: 8080}}
