# Egress-политика уровня 5 (эксплуатация).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mlscan-egress
  namespace: mlscan-ops
  labels: {app.kubernetes.io/part-of: mlscan, mlscan.io/stage: "ingress"}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
  - to:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      podSelector: {matchLabels: {k8s-app: kube-dns}}
    ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
  - to:
    - ipBlock: {cidr: 10.152.0.0/16}
    - ipBlock: {cidr: 10.1.0.0/16}
    ports: [{protocol: TCP, port: 8080}, {protocol: TCP, port: 5432}, {protocol: TCP, port: 3900}, {protocol: TCP, port: 3903}]
