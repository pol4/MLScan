# Egress-контроль платформенных namespace: deny-by-default наружу, разрешены
# только DNS и внутрикластерный трафик (service/pod CIDR). Базовые namespace (уровни 2–3).
# Egress-контроль платформенных namespace: deny-by-default наружу, разрешены
# только DNS и внутрикластерный трафик (service/pod CIDR). Заменяет неявный
# «открытый egress» платформенных сервисов на явный allowlist.
# Песочница (mlscan-sandbox) имеет собственную, более строгую политику.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mlscan-egress
  namespace: mlscan-testing
  labels: {app.kubernetes.io/part-of: mlscan, mlscan.io/stage: "ingress"}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
  - to:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      podSelector: {matchLabels: {k8s-app: kube-dns}}
    ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
  # ClusterIP сервиса kubernetes (адрес подставляется apply.sh: 203.0.113.1 -> реальный)
  - to:
    - ipBlock: {cidr: 203.0.113.1/32}
    ports: [{protocol: TCP, port: 443}]
  # Сужаем egress до нужных namespace (docs/14, P1-1): только данные MLScan (S3/PostgreSQL)
  # Внутрикластерный доступ: только нужные порты (ClusterIP/pod CIDR).
  # NB: в этом Calico egress оценивается до DNAT, поэтому правила по namespace
  # для ClusterIP не срабатывают — сужаем по портам (docs/14, P1-1).
  - to:
    - ipBlock: {cidr: 10.96.0.0/12}
    - ipBlock: {cidr: 10.16.0.0/12}
    ports: [{protocol: TCP, port: 3900}, {protocol: TCP, port: 3903}, {protocol: TCP, port: 5432}]
  # Kubernetes API: адрес/порт зависят от инсталляции; IP подставляется при применении
  # (deploy/ingress/apply.sh находит endpoint API и заменяет 198.51.100.10)
  - to:
    - ipBlock: {cidr: 198.51.100.10/32}
    ports: [{protocol: TCP, port: 16443}, {protocol: TCP, port: 443}]

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mlscan-egress
  namespace: mlscan-analytics
  labels: {app.kubernetes.io/part-of: mlscan, mlscan.io/stage: "ingress"}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
  - to:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      podSelector: {matchLabels: {k8s-app: kube-dns}}
    ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
  # ClusterIP сервиса kubernetes (адрес подставляется apply.sh: 203.0.113.1 -> реальный)
  - to:
    - ipBlock: {cidr: 203.0.113.1/32}
    ports: [{protocol: TCP, port: 443}]
  # Внутрикластерный доступ: только нужные порты (ClusterIP/pod CIDR).
  # NB: в этом Calico egress оценивается до DNAT, поэтому правила по namespace
  # для ClusterIP не срабатывают — сужаем по портам (docs/14, P1-1).
  - to:
    - ipBlock: {cidr: 10.96.0.0/12}
    - ipBlock: {cidr: 10.16.0.0/12}
    ports: [{protocol: TCP, port: 8080}, {protocol: TCP, port: 3900}, {protocol: TCP, port: 3903}, {protocol: TCP, port: 5432}]
