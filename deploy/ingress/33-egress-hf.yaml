# HF-egress (docs/15 §10, B3): доступ ТОЛЬКО к Hugging Face и адресам загрузки моделей (443).
# FQDN-политики в этом Calico-CRD нет, поэтому allowlist по IP-адресам хостов HF и его CDN:
#   huggingface.co, *.hf.co (cdn-lfs*, us.aws.cdn.hf.co), cas-bridge/cas-server/transfer.xethub.hf.co
# Включены /32 найденных адресов и /24 их подсетей (устойчивость к ротации внутри подсети).
# Обновлять при смене адресов HF: перезапустить генерацию (см. deploy/ingress/README.md).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mlscan-hf-egress
  namespace: mlscan-testing
  labels: {app.kubernetes.io/part-of: mlscan, mlscan.io/stage: "ingress"}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
  - ports:
    - {protocol: TCP, port: 443}
    to:
    - ipBlock: {cidr: 100.52.79.0/24}
    - ipBlock: {cidr: 100.52.79.44/32}
