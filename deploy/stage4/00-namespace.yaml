apiVersion: v1
kind: Namespace
metadata:
  name: mlscan-integrations
  labels:
    app.kubernetes.io/part-of: mlscan
    app.kubernetes.io/component: integrations
    mlscan.io/stage: "4"
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlscan-integrations-data
  namespace: mlscan-integrations
  labels: {app.kubernetes.io/part-of: mlscan, mlscan.io/stage: "4"}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: microk8s-hostpath
  resources:
    requests:
      storage: 512Mi
