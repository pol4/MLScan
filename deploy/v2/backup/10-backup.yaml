# Бэкап PostgreSQL MLScan: pg_dump -> PVC, хранение последних N дампов.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlscan-backups
  namespace: mlscan-data
  labels: {app.kubernetes.io/part-of: mlscan, mlscan.io/stage: "v2-i4"}
spec:
  accessModes: ["ReadWriteOnce"]
  # StorageClass локального тома; при переносе замените на свой
  storageClassName: microk8s-hostpath
  resources:
    requests:
      storage: 10Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mlscan-pg-backup
  namespace: mlscan-data
  labels: {app: mlscan-pg-backup, app.kubernetes.io/part-of: mlscan, mlscan.io/stage: "v2-i4"}
spec:
  schedule: "0 2 * * *"          # ежедневно
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels: {app: mlscan-pg-backup}
        spec:
          restartPolicy: Never
          containers:
          - name: dump
            image: postgres:16-alpine
            imagePullPolicy: IfNotPresent
            env:
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: mlscan-pg, key: POSTGRES_PASSWORD}}
            - {name: PGHOST, value: postgres.mlscan-data.svc.cluster.local}
            - {name: PGUSER, value: mlscan}
            - {name: PGDATABASE, value: mlscan}
            command: ["/bin/sh", "-c"]
            args:
            - |
              set -e
              ts=$(date +%Y%m%d-%H%M%S)
              out="/backup/mlscan-$ts.sql.gz"
              pg_dump -h "$PGHOST" -U "$PGUSER" -d "$PGDATABASE" --no-owner | gzip > "$out"
              ls -1t /backup/mlscan-*.sql.gz | tail -n +8 | xargs -r rm -f
              echo "backup ok: $out ($(du -h "$out" | cut -f1))"
            resources:
              requests: {cpu: "100m", memory: "128Mi"}
              limits: {cpu: "1", memory: "512Mi"}
            volumeMounts:
            - {name: backup, mountPath: /backup}
          volumes:
          - name: backup
            persistentVolumeClaim: {claimName: mlscan-backups}
