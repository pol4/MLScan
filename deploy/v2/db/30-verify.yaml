# Проверка stdlib-клиента PostgreSQL (SCRAM) против БД MLScan.
apiVersion: batch/v1
kind: Job
metadata:
  name: pgclient-verify
  namespace: mlscan-data
  labels: {app.kubernetes.io/part-of: mlscan, mlscan.io/stage: "v2-i2"}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 900
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: verify
        image: python:3.12-slim
        imagePullPolicy: IfNotPresent
        command: ["python", "/opt/pgv/verify_pg.py"]
        env:
        - {name: PGHOST, value: postgres.mlscan-data.svc.cluster.local}
        - {name: PGPORT, value: "5432"}
        - {name: PGUSER, value: mlscan}
        - {name: PGDATABASE, value: mlscan}
        - name: PGPASSWORD
          valueFrom: {secretKeyRef: {name: mlscan-pg, key: POSTGRES_PASSWORD}}
        resources:
          requests: {cpu: "50m", memory: "64Mi"}
          limits: {cpu: "500m", memory: "256Mi"}
        volumeMounts:
        - {name: pg, mountPath: /opt/pg, readOnly: true}
        - {name: pgv, mountPath: /opt/pgv, readOnly: true}
      volumes:
      - {name: pg, configMap: {name: mlscan-pgclient}}
      - {name: pgv, configMap: {name: mlscan-pgverify}}
