# PostgreSQL для MLScan (I2): единый экземпляр в namespace mlscan-data.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: mlscan-data
  labels: {app: postgres, app.kubernetes.io/part-of: mlscan}
spec:
  selector: {app: postgres}
  ports:
  - {name: pg, port: 5432, targetPort: 5432}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: mlscan-data
  labels: {app: postgres, app.kubernetes.io/part-of: mlscan, mlscan.io/stage: "v2-i2"}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      securityContext:
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
      containers:
      - name: postgres
        image: postgres:16-alpine
        imagePullPolicy: IfNotPresent
        env:
        - {name: POSTGRES_DB, value: mlscan}
        - {name: POSTGRES_USER, value: mlscan}
        - name: POSTGRES_PASSWORD
          valueFrom: {secretKeyRef: {name: mlscan-pg, key: POSTGRES_PASSWORD}}
        - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
        ports:
        - {name: pg, containerPort: 5432}
        readinessProbe:
          exec: {command: ["pg_isready", "-U", "mlscan", "-d", "mlscan"]}
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          exec: {command: ["pg_isready", "-U", "mlscan", "-d", "mlscan"]}
          initialDelaySeconds: 30
          periodSeconds: 20
        resources:
          requests: {cpu: "200m", memory: "256Mi"}
          limits: {cpu: "2", memory: "1Gi"}
        volumeMounts:
        - {name: data, mountPath: /var/lib/postgresql/data}
        - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
      volumes:
      - name: init
        configMap: {name: mlscan-pg-init}
  volumeClaimTemplates:
  - metadata: {name: data}
    spec:
      accessModes: ["ReadWriteOnce"]
      # StorageClass локального тома; при переносе замените на свой
      storageClassName: local-path
      resources:
        requests:
          storage: 20Gi
