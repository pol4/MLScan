# Проверка Ingest Gateway: загрузка 1 ГиБ в S3 и дедуп на повторной загрузке.
apiVersion: batch/v1
kind: Job
metadata:
  name: ingest-verify
  namespace: mlscan-data
  labels: {app.kubernetes.io/part-of: mlscan, mlscan.io/stage: "v2-i1"}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 900
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: verify
        image: python:3.12-slim
        imagePullPolicy: IfNotPresent
        command: ["python", "/opt/v/verify.py"]
        env:
        - {name: SIZE_MB, value: "1024"}
        resources:
          requests: {cpu: "1", memory: "256Mi"}
          limits: {cpu: "4", memory: "1Gi", ephemeral-storage: "20Gi"}
        volumeMounts:
        - {name: v, mountPath: /opt/v, readOnly: true}
        - {name: data, mountPath: /data}
      volumes:
      - {name: v, configMap: {name: mlscan-ingest-verify}}
      - {name: data, emptyDir: {sizeLimit: 4Gi}}
