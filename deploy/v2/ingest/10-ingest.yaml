# MLScan Ingest Gateway (I1): приём моделей и загрузка в S3.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlscan-ingest
  namespace: mlscan-data
  labels: {app: mlscan-ingest, app.kubernetes.io/part-of: mlscan, mlscan.io/stage: "v2-i1"}
spec:
  replicas: 1
  selector:
    matchLabels: {app: mlscan-ingest}
  template:
    metadata:
      labels: {app: mlscan-ingest}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: ingest
        image: python:3.12-slim
        imagePullPolicy: IfNotPresent
        command: ["python", "/opt/ingest/ingest.py"]
        env:
        - name: S3_ENDPOINT
          valueFrom: {secretKeyRef: {name: mlscan-s3, key: ENDPOINT}}
        - name: S3_REGION
          valueFrom: {secretKeyRef: {name: mlscan-s3, key: REGION}}
        - name: S3_BUCKET
          valueFrom: {secretKeyRef: {name: mlscan-s3, key: BUCKET}}
        - name: S3_ACCESS_KEY
          valueFrom: {secretKeyRef: {name: mlscan-s3, key: ACCESS_KEY}}
        - name: S3_SECRET_KEY
          valueFrom: {secretKeyRef: {name: mlscan-s3, key: SECRET_KEY}}
        - {name: DATA_TMP, value: /var/tmp}
        - {name: PORT, value: "8080"}
        - {name: MAX_UPLOAD, value: "1099511627776"}
        - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
        ports:
        - {name: http, containerPort: 8080}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: ["ALL"]}
        readinessProbe:
          httpGet: {path: /healthz, port: 8080}
          initialDelaySeconds: 3
        resources:
          requests: {cpu: "200m", memory: "256Mi"}
          limits: {cpu: "4", memory: "1Gi", ephemeral-storage: "150Gi"}
        volumeMounts:
        - {name: s3client, mountPath: /opt/s3, readOnly: true}
        - {name: ingest-code, mountPath: /opt/ingest, readOnly: true}
        - {name: tmp, mountPath: /var/tmp}
      volumes:
      - {name: s3client, configMap: {name: mlscan-s3client}}
      - {name: ingest-code, configMap: {name: mlscan-ingest-code}}
      - {name: tmp, emptyDir: {sizeLimit: 120Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: mlscan-ingest
  namespace: mlscan-data
  labels: {app: mlscan-ingest}
spec:
  selector: {app: mlscan-ingest}
  ports:
  - {name: http, port: 8080, targetPort: 8080}
