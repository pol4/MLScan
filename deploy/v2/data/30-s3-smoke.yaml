# Smoke-тест S3 из пода (stdlib SigV4-клиент) — проверка PUT/GET/HEAD.
apiVersion: batch/v1
kind: Job
metadata:
  name: s3-smoke
  namespace: mlscan-data
  labels: {app.kubernetes.io/part-of: mlscan, mlscan.io/stage: "v2-i1"}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 900
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: smoke
        image: python:3.12-slim
        imagePullPolicy: IfNotPresent
        command: ["python", "/opt/s3/smoke.py"]
        env:
        - name: S3_ENDPOINT
          valueFrom: {secretKeyRef: {name: mlscan-s3, key: ENDPOINT}}
        - name: S3_REGION
          valueFrom: {secretKeyRef: {name: mlscan-s3, key: REGION}}
        - name: S3_BUCKET
          valueFrom: {secretKeyRef: {name: mlscan-s3, key: BUCKET}}
        - name: S3_ACCESS_KEY
          valueFrom: {secretKeyRef: {name: mlscan-s3, key: ACCESS_KEY}}
        - name: S3_SECRET_KEY
          valueFrom: {secretKeyRef: {name: mlscan-s3, key: SECRET_KEY}}
        resources:
          requests: {cpu: "50m", memory: "64Mi"}
          limits: {cpu: "500m", memory: "256Mi"}
        volumeMounts:
        - {name: s3client, mountPath: /opt/s3, readOnly: true}
      volumes:
      - name: s3client
        configMap: {name: mlscan-s3client}
