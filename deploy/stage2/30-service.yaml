# Сервис тестирования (Компонента 2). stdlib-only, non-root, read-only rootfs.
# Транспорт артефакта: PVC /artifacts + отдача в песочницу на порту 8090 по токену.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlscan-testing
  namespace: mlscan-testing
  labels: {app: mlscan-testing, app.kubernetes.io/part-of: mlscan, mlscan.io/stage: "2"}
spec:
  replicas: 1
  selector:
    matchLabels: {app: mlscan-testing}
  template:
    metadata:
      labels: {app: mlscan-testing}
    spec:
      serviceAccountName: mlscan-testing
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: testing
        image: python:3.12-slim
        imagePullPolicy: IfNotPresent
        command: ["python", "/opt/svc/mlscan_testing.py"]
        env:
        - {name: SANDBOX_NS, value: mlscan-sandbox}
        - {name: DATA_DIR, value: /data}
        - {name: ARTIFACTS_DIR, value: /artifacts}
        - {name: PORT, value: "8080"}
        - {name: ARTIFACT_PORT, value: "8090"}
        - {name: ARTIFACT_BASE, value: "http://mlscan-testing.mlscan-testing.svc.cluster.local:8090"}
        - {name: JOB_TIMEOUT, value: "600"}
        - {name: JOB_MEMORY, value: "2Gi"}
        - {name: JOB_EPHEMERAL, value: "8Gi"}
        - {name: TMP_SIZE, value: "6Gi"}
        - {name: SANDBOX_IMAGE, value: "localhost:32000/mlscan-sandbox:v2"}
        - {name: DATA_TMP, value: /var/tmp}
        - name: S3_ENDPOINT
          valueFrom: {secretKeyRef: {name: mlscan-s3, key: ENDPOINT}}
        - name: S3_REGION
          valueFrom: {secretKeyRef: {name: mlscan-s3, key: REGION}}
        - name: S3_BUCKET
          valueFrom: {secretKeyRef: {name: mlscan-s3, key: BUCKET}}
        - name: S3_ACCESS_KEY
          valueFrom: {secretKeyRef: {name: mlscan-s3, key: ACCESS_KEY}}
        - name: S3_SECRET_KEY
          valueFrom: {secretKeyRef: {name: mlscan-s3, key: SECRET_KEY}}
        - {name: PGHOST, value: postgres.mlscan-data.svc.cluster.local}
        - {name: PGPORT, value: "5432"}
        - {name: PGUSER, value: mlscan}
        - {name: PGDATABASE, value: mlscan}
        - name: PGPASSWORD
          valueFrom: {secretKeyRef: {name: mlscan-pg, key: POSTGRES_PASSWORD}}
        - {name: MAX_UPLOAD, value: "21474836480"}
        - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
        - {name: PYTHONUTF8, value: "1"}
        - {name: TMPDIR, value: /tmp}
        - name: MLSCAN_KEYS
          valueFrom: {secretKeyRef: {name: mlscan-keys, key: MLSCAN_KEYS}}
        ports:
        - {name: http, containerPort: 8080}
        - {name: artifacts, containerPort: 8090}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: ["ALL"]}
        readinessProbe:
          httpGet: {path: /healthz, port: 8080}
          initialDelaySeconds: 3
          periodSeconds: 10
        livenessProbe:
          httpGet: {path: /healthz, port: 8080}
          initialDelaySeconds: 10
          periodSeconds: 20
        resources:
          requests: {cpu: "100m", memory: "128Mi", ephemeral-storage: "1Gi"}
          limits: {cpu: "2", memory: "1Gi", ephemeral-storage: "150Gi"}
        volumeMounts:
        - {name: poc-lib, mountPath: /opt/mlscan, readOnly: true}
        - {name: svc-code, mountPath: /opt/svc, readOnly: true}
        - {name: data, mountPath: /data}
        - {name: s3client, mountPath: /opt/s3, readOnly: true}
        - {name: pgclient, mountPath: /opt/pg, readOnly: true}
        - {name: formats, mountPath: /opt/formats, readOnly: true}
        - {name: authz, mountPath: /opt/auth, readOnly: true}
        - {name: modeltmp, mountPath: /var/tmp}
        - {name: tmp, mountPath: /tmp}
      volumes:
      - {name: poc-lib, configMap: {name: mlscan-poc-lib}}
      - {name: svc-code, configMap: {name: mlscan-testing-code}}
      - {name: data, persistentVolumeClaim: {claimName: mlscan-testing-data}}
      - {name: s3client, configMap: {name: mlscan-s3client}}
      - {name: pgclient, configMap: {name: mlscan-pgclient}}
      - {name: formats, configMap: {name: mlscan-formats}}
      - {name: authz, configMap: {name: mlscan-authz}}
      - {name: modeltmp, emptyDir: {sizeLimit: 120Gi}}
      - {name: tmp, emptyDir: {sizeLimit: 512Mi, medium: Memory}}
---
apiVersion: v1
kind: Service
metadata:
  name: mlscan-testing
  namespace: mlscan-testing
  labels: {app: mlscan-testing}
spec:
  selector: {app: mlscan-testing}
  ports:
  - {name: http, port: 8080, targetPort: 8080}
  - {name: artifacts, port: 8090, targetPort: 8090}
