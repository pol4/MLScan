# Сервис тестирования (Компонента 2). stdlib-only, non-root, read-only rootfs.
# Транспорт артефакта: PVC /artifacts + отдача в песочницу на порту 8090 по токену.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlscan-testing
  namespace: mlscan-testing
  labels: {app: mlscan-testing, app.kubernetes.io/part-of: mlscan, mlscan.io/stage: "2"}
spec:
  replicas: 1
  selector:
    matchLabels: {app: mlscan-testing}
  template:
    metadata:
      labels: {app: mlscan-testing}
    spec:
      serviceAccountName: mlscan-testing
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: testing
        image: python:3.12-slim
        imagePullPolicy: IfNotPresent
        command: ["python", "/opt/svc/mlscan_testing.py"]
        env:
        - {name: SANDBOX_NS, value: mlscan-sandbox}
        - {name: DATA_DIR, value: /data}
        - {name: ARTIFACTS_DIR, value: /artifacts}
        - {name: PORT, value: "8080"}
        - {name: ARTIFACT_PORT, value: "8090"}
        - {name: ARTIFACT_BASE, value: "http://mlscan-testing.mlscan-testing.svc.cluster.local:8090"}
        - {name: JOB_TIMEOUT, value: "600"}
        - {name: JOB_MEMORY, value: "3Gi"}
        - {name: JOB_EPHEMERAL, value: "8Gi"}
        - {name: TMP_SIZE, value: "6Gi"}
        # ВНИМАНИЕ: значение-заглушка (тег). Политика Kyverno требует ССЫЛКУ ПО DIGEST, поэтому
        # после `kubectl apply` этого файла обязательно выполнить `deploy/stage2/apply.sh`
        # (шаг «SANDBOX_IMAGE по digest») либо set env SANDBOX_IMAGE=<repo>@sha256:<digest>;
        # иначе sandbox-джобы сканов будут отклонены admission-политикой.
        - {name: SANDBOX_IMAGE, value: "localhost:32000/mlscan-sandbox:v4"}
        - {name: DATA_TMP, value: /var/tmp}
        - name: S3_ENDPOINT
          valueFrom: {secretKeyRef: {name: mlscan-s3, key: ENDPOINT}}
        - name: S3_REGION
          valueFrom: {secretKeyRef: {name: mlscan-s3, key: REGION}}
        - name: S3_BUCKET
          valueFrom: {secretKeyRef: {name: mlscan-s3, key: BUCKET}}
        - name: S3_ACCESS_KEY
          valueFrom: {secretKeyRef: {name: mlscan-s3, key: ACCESS_KEY}}
        - name: S3_SECRET_KEY
          valueFrom: {secretKeyRef: {name: mlscan-s3, key: SECRET_KEY}}
        # Внешний адрес S3 для presigned-URL (клиенты на АРМ/CI). На стенде задаётся как
        # http://<NODE_IP>:31317 (см. tests/e2e/run_direct_upload_arm_e2e.sh); в среде с DNS —
        # http://s3.mlscan.local:31317 (требуется резолвинг имени). TCP-passthrough Istio.
        - {name: S3_PUBLIC_ENDPOINT, value: "http://s3.mlscan.local:31317"}
        - {name: PGHOST, value: postgres.mlscan-data.svc.cluster.local}
        - {name: PGPORT, value: "5432"}
        - {name: PGUSER, value: mlscan}
        - {name: PGDATABASE, value: mlscan}
        - name: PGPASSWORD
          valueFrom: {secretKeyRef: {name: mlscan-pg, key: POSTGRES_PASSWORD}}
        - {name: MAX_UPLOAD, value: "1099511627776"}
        - {name: S3_PART_SIZE, value: "67108864"}
        - {name: S3_PART_WORKERS, value: "16"}
        - {name: DIRECT_PART_SIZE, value: "268435456"}
        - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
        - {name: MLSCAN_LANG, value: "ru"}
        # Hugging Face: реальный HF (egress-политика ставится deploy/ingress/apply.sh, шаг [5/6]);
        # HF_MOCK=1 — изолированный mock-режим для тестов без интернета.
        - {name: HF_MOCK, value: "0"}
        - {name: HF_BASE_URL, value: "https://huggingface.co"}
        - {name: HF_FLAKY, value: "0"}
        # Пределы загрузки HF (защита PVC/памяти): неизвестный размер -> отказ
        - {name: HF_MAX_FILE_BYTES, value: "8589934592"}
        - {name: HF_MAX_TOTAL_BYTES, value: "68719476736"}
        # Ключ обратимого хранения per-tenant HF-токена (P6 per-tenant KMS)
        - name: MLSCAN_TOKEN_KEY
          valueFrom: {secretKeyRef: {name: mlscan-keys, key: MLSCAN_EVIDENCE_KEY}}
        - {name: PYTHONUTF8, value: "1"}
        - {name: TMPDIR, value: /tmp}
        - name: MLSCAN_KEYS
          valueFrom: {secretKeyRef: {name: mlscan-keys, key: MLSCAN_KEYS}}
        ports:
        - {name: http, containerPort: 8080}
        - {name: artifacts, containerPort: 8090}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: ["ALL"]}
        readinessProbe:
          httpGet: {path: /healthz, port: 8080}
          initialDelaySeconds: 3
          periodSeconds: 10
        livenessProbe:
          httpGet: {path: /healthz, port: 8080}
          initialDelaySeconds: 10
          periodSeconds: 20
        resources:
          requests: {cpu: "100m", memory: "256Mi", ephemeral-storage: "1Gi"}
          limits: {cpu: "2", memory: "3Gi", ephemeral-storage: "1Ti"}
        volumeMounts:
        - {name: poc-lib, mountPath: /opt/mlscan, readOnly: true}
        - {name: svc-code, mountPath: /opt/svc, readOnly: true}
        - {name: data, mountPath: /data}
        - {name: s3client, mountPath: /opt/s3, readOnly: true}
        - {name: pgclient, mountPath: /opt/pg, readOnly: true}
        - {name: formats, mountPath: /opt/formats, readOnly: true}
        - {name: authz, mountPath: /opt/auth, readOnly: true}
        - {name: i18n, mountPath: /opt/i18n, readOnly: true}
        - {name: v3ingest, mountPath: /opt/v3ingest, readOnly: true}
        - {name: v3control, mountPath: /opt/v3control, readOnly: true}
        - {name: v3llm, mountPath: /opt/v3llm, readOnly: true}
        - {name: v3registry, mountPath: /opt/v3registry, readOnly: true}
        - {name: v3analysis, mountPath: /opt/v3analysis, readOnly: true}
        - {name: v3security, mountPath: /opt/v3security, readOnly: true}
        - {name: v3obs, mountPath: /opt/v3obs, readOnly: true}
        - {name: v3migration, mountPath: /opt/v3migration, readOnly: true}
        - {name: modeltmp, mountPath: /var/tmp}
        - {name: tmp, mountPath: /tmp}
      volumes:
      - {name: poc-lib, configMap: {name: mlscan-poc-lib}}
      - {name: svc-code, configMap: {name: mlscan-testing-code}}
      - {name: data, persistentVolumeClaim: {claimName: mlscan-testing-data}}
      - {name: s3client, configMap: {name: mlscan-s3client}}
      - {name: pgclient, configMap: {name: mlscan-pgclient}}
      - {name: formats, configMap: {name: mlscan-formats}}
      - {name: authz, configMap: {name: mlscan-authz}}
      - {name: i18n, configMap: {name: mlscan-i18n}}
      - {name: v3ingest, configMap: {name: mlscan-v3-ingest}}
      - {name: v3control, configMap: {name: mlscan-v3-control}}
      - {name: v3llm, configMap: {name: mlscan-v3-llm}}
      - {name: v3registry, configMap: {name: mlscan-v3-registry}}
      - {name: v3analysis, configMap: {name: mlscan-v3-analysis}}
      - {name: v3security, configMap: {name: mlscan-v3-security}}
      - {name: v3obs, configMap: {name: mlscan-v3-obs}}
      - {name: v3migration, configMap: {name: mlscan-v3-migration}}
      - {name: modeltmp, emptyDir: {sizeLimit: 120Gi}}
      - {name: tmp, emptyDir: {sizeLimit: 512Mi, medium: Memory}}
---
apiVersion: v1
kind: Service
metadata:
  name: mlscan-testing
  namespace: mlscan-testing
  labels: {app: mlscan-testing}
spec:
  selector: {app: mlscan-testing}
  ports:
  - {name: http, port: 8080, targetPort: 8080}
  - {name: artifacts, port: 8090, targetPort: 8090}
