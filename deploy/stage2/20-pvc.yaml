# Хранилище результатов сканирований и артефактов моделей.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlscan-testing-data
  namespace: mlscan-testing
  labels: {app.kubernetes.io/part-of: mlscan, mlscan.io/stage: "2"}
spec:
  accessModes: ["ReadWriteOnce"]
  # StorageClass локального тома (в MicroK8s по умолчанию); при переносе замените на свой
  storageClassName: microk8s-hostpath
  resources:
    requests:
      storage: 1Gi
---
# Отдельный (большой) том для загружаемых моделей — поддерживает большие файлы.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlscan-artifacts
  namespace: mlscan-testing
  labels: {app.kubernetes.io/part-of: mlscan, mlscan.io/stage: "2"}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: microk8s-hostpath
  resources:
    requests:
      storage: 20Gi
