    uid: ecd1c25f-557e-42d0-965c-fa9510706221
  spec:
    admission: true
    background: false
    emitWarning: false
    rules:
    - match:
        any:
        - resources:
            kinds:
            - Job
            namespaces:
            - mlscan-sandbox
      name: require-kata-and-digest-image
      skipBackgroundRequests: true
      validate:
        allowExistingViolations: true
        message: Job в mlscan-sandbox должен использовать runtimeClassName=kata и
          образ mlscan-sandbox по digest
        pattern:
          spec:
            template:
              spec:
                containers:
                - image: '*mlscan-sandbox@sha256:*'
                runtimeClassName: kata
    - match:
        any:
        - resources:
            kinds:
            - Job
            namespaces:
            - mlscan-sandbox
      name: require-hardened-security-context
      skipBackgroundRequests: true
      validate:
        allowExistingViolations: true
        deny:
          conditions:
            all:
            - key: '{{ request.object.spec.template.spec.containers[?name!=''ebpf-agent''].securityContext.capabilities.add[]
                | length(@) }}'
              operator: GreaterThan
              value: 0
            - key: '{{ request.object.spec.template.spec.containers[?name!=''ebpf-agent''].securityContext.runAsNonRoot
                | [?@ != `true`] | length(@) }}'
              operator: GreaterThan
              value: 0
            - key: '{{ request.object.spec.template.spec.containers[?securityContext.allowPrivilegeEscalation!=''false''].securityContext.allowPrivilegeEscalation
                }}'
              operator: AnyIn
              value:
              - "true"
              - "True"
              - 1
              - "1"
            - key: '{{ request.object.spec.template.spec.containers[?securityContext.readOnlyRootFilesystem!=''true''].securityContext.readOnlyRootFilesystem
                }}'
              operator: AnyIn
              value:
              - "false"
              - "False"
              - 0
              - "0"
            - key: '{{ request.object.spec.template.spec.containers[].securityContext.capabilities.drop[]
                | [?@ != ''ALL''] | length(@) }}'
              operator: GreaterThan
              value: 0
            - key: '{{ request.object.spec.template.spec.automountServiceAccountToken
                }}'
              operator: AnyIn
              value:
              - true
              - "true"
              - "True"
              - 1
              - "1"
            - key: '{{ request.object.spec.template.spec.securityContext.seccompProfile.type
                }}'
              operator: NotEquals
              value: RuntimeDefault
        message: 'Job в mlscan-sandbox: все контейнеры кроме `ebpf-agent` должны быть
          non-root; у всех — drop ALL, no-priv-escalation, RO-FS, seccomp; pod — без
          service account токена'
    validationFailureAction: Enforce
