        {"apiVersion":"kyverno.io/v1","kind":"ClusterPolicy","metadata":{"annotations":{},"name":"mlscan-ebpf-agent-guard"},"spec":{"background":false,"rules":[{"match":{"any":[{"resources":{"kinds":["Job"],"namespaces":["mlscan-sandbox"]}}]},"name":"agent-caps-allowlist","validate":{"deny":{"conditions":{"any":[{"key":"{{ request.object.spec.template.spec.containers[?name=='ebpf-agent'].securityContext.capabilities.add[] | [?@ != 'BPF' \u0026\u0026 @ != 'PERFMON'] | length(@) }}","operator":"GreaterThan","value":0}]}},"message":"контейнеру ebpf-agent разрешены только capabilities BPF и PERFMON"}},{"match":{"any":[{"resources":{"kinds":["Job"],"namespaces":["mlscan-sandbox"]}}]},"name":"no-dangerous-caps-or-privileged","validate":{"deny":{"conditions":{"any":[{"key":"{{ request.object.spec.template.spec.containers[].securityContext.capabilities.add[] }}","operator":"AnyIn","value":["SYS_ADMIN","SYS_PTRACE","SYS_MODULE","NET_ADMIN","NET_RAW","DAC_OVERRIDE","SYS_CHROOT","MKNOD","AUDIT_CONTROL","SYS_TIME","SETUID","SETGID","SYSLOG","MAC_ADMIN","MAC_OVERRIDE","SYS_BOOT","SYS_RAWIO"]},{"key":"{{ request.object.spec.template.spec.containers[].securityContext.privileged }}","operator":"AnyIn","value":[true,"true","True",1,"1"]},{"key":"{{ request.object.spec.template.spec.hostNetwork || `false` }}","operator":"Equals","value":true},{"key":"{{ request.object.spec.template.spec.hostPID || `false` }}","operator":"Equals","value":true},{"key":"{{ request.object.spec.template.spec.volumes[].hostPath | length(@) }}","operator":"GreaterThan","value":0}]}},"message":"в mlscan-sandbox запрещены privileged/host*/опасные capabilities"}}],"validationFailureAction":"Enforce"}}
    creationTimestamp: "2026-10-27T12:08:06Z"
    generation: 3
    name: mlscan-ebpf-agent-guard
    resourceVersion: "31823560"
    uid: b49fc1ec-ce29-47af-86dc-b217546b40bc
  spec:
    admission: true
    background: false
    emitWarning: false
    rules:
    - match:
        any:
        - resources:
            kinds:
            - Job
            namespaces:
            - mlscan-sandbox
      name: agent-caps-allowlist
      skipBackgroundRequests: true
      validate:
        allowExistingViolations: true
        deny:
          conditions:
            any:
            - key: '{{ request.object.spec.template.spec.containers[?name==''ebpf-agent''].securityContext.capabilities.add[]
                | [?@ != ''BPF'' && @ != ''PERFMON''] | length(@) }}'
              operator: GreaterThan
              value: 0
        message: контейнеру ebpf-agent разрешены только capabilities BPF и PERFMON
    - match:
        any:
        - resources:
            kinds:
            - Job
            namespaces:
            - mlscan-sandbox
      name: no-dangerous-caps-or-privileged
      skipBackgroundRequests: true
      validate:
        allowExistingViolations: true
        deny:
          conditions:
            any:
            - key: '{{ request.object.spec.template.spec.containers[].securityContext.capabilities.add[]
                }}'
              operator: AnyIn
              value:
              - SYS_ADMIN
              - SYS_PTRACE
              - SYS_MODULE
              - NET_ADMIN
              - NET_RAW
              - DAC_OVERRIDE
              - SYS_CHROOT
              - MKNOD
              - AUDIT_CONTROL
              - SYS_TIME
              - SETUID
              - SETGID
              - SYSLOG
              - MAC_ADMIN
              - MAC_OVERRIDE
              - SYS_BOOT
              - SYS_RAWIO
            - key: '{{ request.object.spec.template.spec.containers[].securityContext.privileged
                }}'
              operator: AnyIn
              value:
              - true
              - "true"
              - "True"
              - 1
              - "1"
            - key: '{{ request.object.spec.template.spec.hostNetwork || `false` }}'
              operator: Equals
              value: true
            - key: '{{ request.object.spec.template.spec.hostPID || `false` }}'
              operator: Equals
              value: true
            - key: '{{ request.object.spec.template.spec.volumes[].hostPath | length(@)
                }}'
              operator: GreaterThan
              value: 0
        message: в mlscan-sandbox запрещены privileged/host*/опасные capabilities
    validationFailureAction: Enforce
  status:
    autogen: {}
    conditions:
    - lastTransitionTime: "2026-10-27T12:08:06Z"
